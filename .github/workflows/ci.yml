name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only needs to read the code
permissions:
  contents: read

# Cancel superseded runs on the same branch or PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and security checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      # Actions are pinned to full commit SHAs, not tags: a tag can be moved to
      # malicious code, a SHA can't. Dependabot keeps these and the comments current.
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest -q

      # Fails only on findings that aren't in the committed baseline.
      # The baseline holds the two known issues scheduled for M3 (see PLAN.md).
      - name: Static security analysis (bandit)
        run: bandit -r SecureVaultAPI LogSentinel -b .bandit-baseline.json

      - name: Dependency vulnerabilities (pip-audit)
        run: pip-audit -r requirements.txt
